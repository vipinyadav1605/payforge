services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payforge
      POSTGRES_PASSWORD: payforge
      POSTGRES_DB: payforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payforge -d payforge"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://payforge:payforge@db:5432/payforge
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app          # dev only: live code reload
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build: ./api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://payforge:payforge@db:5432/payforge
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./api:/app
    depends_on:
      api:
        condition: service_started
    command: python -m app.worker

  web:
    build: ./web
    environment:
      VITE_API_TARGET: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - /app/node_modules   # keep the container's installed packages, don't overwrite with the host folder
    depends_on:
      - api

volumes:
  pgdata:
